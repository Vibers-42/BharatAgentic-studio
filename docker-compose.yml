# Starts all 5 BharatAgent Studio containers with one command: docker compose up --build
# Networks: "data" (api <-> db, ollama), "tools" (api <-> mcp-runner), "frontend" (web <-> api).
# mcp-runner is only on "tools", so a misbehaving tool can never reach the database.
# Published ports bind to 127.0.0.1 so nothing is reachable from other machines on the LAN.
# restart: unless-stopped brings every service back after Docker Desktop or the computer restarts.

services:
  db:
    image: pgvector/pgvector:0.8.7-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bharat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bharatagent}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bharat} -d ${POSTGRES_DB:-bharatagent}"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.40.17
    restart: unless-stopped
    environment:
      # Less memory per loaded model, so qwen3:14b and bge-m3 fit side by side on a laptop.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - ollama:/root/.ollama
    networks: [data]
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  mcp-runner:
    build: ./mcp-runner
    restart: unless-stopped
    networks: [tools]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8100), 2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      OLLAMA_URL: http://ollama:11434
      MCP_URL: http://mcp-runner:8100/mcp
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    networks: [data, tools, frontend]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      mcp-runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: ./web
    restart: unless-stopped
    networks: [frontend]
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy

networks:
  data:
  tools:
  frontend:

volumes:
  pgdata:
  ollama:
  uploads:
