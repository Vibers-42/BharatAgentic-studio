# Serves the built React app and forwards /api/* to the FastAPI container.
# Buffering is off so the pipeline's live status events (added in Phase 2) stream instantly.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }

    location / {
        try_files $uri /index.html;
    }
}
